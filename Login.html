<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso – UVY</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul:   #1B3A6B;
  --azul-l: #2B5399;
  --dorado: #C8A951;
  --bg:     #F0F3F8;
  --card:   #FFFFFF;
  --border: #D1D9E6;
  --text:   #1A2035;
  --muted:  #6B7A99;
  --danger: #D94040;
}
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px;
}
.login-card {
  background: var(--card); border-radius: 14px;
  box-shadow: 0 4px 24px rgba(27,58,107,.13);
  border: 1px solid var(--border);
  width: 100%; max-width: 400px; padding: 40px 36px;
}
.logo {
  text-align: center; margin-bottom: 28px;
}
.logo .brand { font-size: 1.3rem; font-weight: 800; color: var(--azul); }
.logo .brand span { color: var(--dorado); }
.logo .sub { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.divider {
  height: 3px; background: linear-gradient(90deg, var(--azul), var(--dorado));
  border-radius: 2px; margin-bottom: 28px;
}
label {
  display: block; font-size: .82rem; font-weight: 600;
  color: var(--azul); margin-bottom: 6px;
}
input[type="text"], input[type="password"] {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: .93rem; color: var(--text);
  transition: border-color .15s; outline: none;
  margin-bottom: 18px;
}
input:focus { border-color: var(--azul-l); }
.btn {
  width: 100%; padding: 12px;
  background: var(--azul); color: #fff;
  border: none; border-radius: 8px;
  font-size: .95rem; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.err {
  display: none; background: #FEE2E2; border: 1px solid #FECACA;
  color: var(--danger); border-radius: 7px;
  padding: 10px 14px; font-size: .85rem; margin-bottom: 16px;
}
.spinner {
  display: none; width: 20px; height: 20px;
  border: 3px solid rgba(255,255,255,.4);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .7s linear infinite; margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="brand">Universidad de Valladolid <span>Yucatán</span></div>
    <div class="sub">Portal de Servicios Internos</div>
  </div>
  <div class="divider"></div>

  <div class="err" id="err-msg"></div>

  <label for="usuario">Usuario</label>
  <input type="text" id="usuario" placeholder="Ingresa tu usuario" autocomplete="username">

  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button class="btn" id="btn-login" onclick="doLogin()">
    <span id="btn-text">Iniciar sesión</span>
    <div class="spinner" id="spinner"></div>
  </button>
</div>

<script>
var APP_URL = '<?!= appUrl ?>';

document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('usuario').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

function doLogin() {
  var usuario  = document.getElementById('usuario').value.trim();
  var password = document.getElementById('password').value;
  var err      = document.getElementById('err-msg');
  err.style.display = 'none';

  if (!usuario || !password) {
    err.textContent = 'Ingresa usuario y contraseña.';
    err.style.display = 'block';
    return;
  }

  var btn = document.getElementById('btn-login');
  btn.disabled = true;
  document.getElementById('btn-text').style.display = 'none';
  document.getElementById('spinner').style.display  = 'block';

  google.script.run
    .withSuccessHandler(function(res) {
      if (res.ok) {
        window.top.location.href = APP_URL + '?token=' + res.token;
      } else {
        err.textContent = res.error || 'Error al iniciar sesión.';
        err.style.display = 'block';
        btn.disabled = false;
        document.getElementById('btn-text').style.display = 'block';
        document.getElementById('spinner').style.display  = 'none';
      }
    })
    .withFailureHandler(function(e) {
      err.textContent = 'Error de conexión: ' + e.message;
      err.style.display = 'block';
      btn.disabled = false;
      document.getElementById('btn-text').style.display = 'block';
      document.getElementById('spinner').style.display  = 'none';
    })
    .login(usuario, password);
}
</script>
</body>
</html>
